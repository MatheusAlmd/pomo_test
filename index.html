<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="timer-card" aria-labelledby="pomodoro-title">
        <p class="eyebrow">Focus Mode</p>
        <h1 id="pomodoro-title">Pomodoro Studio</h1>
        <p id="statusLabel" class="status-label">Sessão de foco • 1 hora</p>

        <div class="dial-wrapper" aria-live="polite" aria-atomic="true">
          <svg class="dial" viewBox="0 0 200 200" role="img" aria-label="Progresso do timer">
            <circle class="dial-track" cx="100" cy="100" r="88" />
            <circle id="dialProgress" class="dial-progress" cx="100" cy="100" r="88" />
          </svg>
          <div id="timeDisplay" class="time-display">01:00:00</div>
        </div>

        <div class="actions">
          <button id="mainToggle" class="button button-primary" type="button">
            Iniciar foco
          </button>
          <button id="breakButton" class="button button-secondary" type="button">
            Pausa de 10 min
          </button>
          <button id="resetButton" class="button button-ghost" type="button">
            Reiniciar
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
